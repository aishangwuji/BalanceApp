name: mirror-from-gitee

# Gitee 为主干（本机网络可直连），GitHub 通过本工作流拉取镜像，
# 解决国内直连 github.com 被重置、无法直接 push 的问题。
# 触发：每 2 小时定时 + 手动 dispatch（推完 Gitee 后可手动触发一次立即同步）。

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: mirror-from-gitee
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Gitee repository
        run: |
          set -euo pipefail
          git clone --mirror https://gitee.com/aishangwuji/BalanceApp.git repo.git

      - name: Push mirror to GitHub
        run: |
          set -euo pipefail
          cd repo.git
          git push --mirror "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
